<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spirit of Math Drills</title>
  <!-- Scripts are loaded as classic scripts in dependency order, not ES modules:
       browsers block module loading over file:// and this app must run by
       double-clicking index.html with no server and no build step. -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/grid.css">
  <link rel="stylesheet" href="css/result.css">
</head>
<body>
  <!-- Single root container; every view renders inside it. -->
  <main id="app"></main>

  <script src="js/random.js"></script>
  <script src="js/config.js"></script>
  <script src="js/walk.js"></script>
  <script src="js/generators/add.js"></script>
  <script src="js/generators/subtract.js"></script>
  <script src="js/generators/multiply.js"></script>
  <script src="js/generators/divide.js"></script>
  <script src="js/generators/generate.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/keys.js"></script>
  <script src="js/ui/drillView.js"></script>
  <script src="js/ui/entryView.js"></script>
  <script src="js/ui/drillHud.js"></script>
  <script src="js/ui/resultView.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/state.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
